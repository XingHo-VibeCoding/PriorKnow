<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Day 24 收尾：站点图标。
         原来什么都没有，浏览器每次都会去要 /favicon.ico 并拿到 404 ——
         于是**每一个页面**的控制台里都躺着一条红字。
         一条不痛不痒的红字，代价是「控制台干净」这件事永远做不到：
         以后真有报错，就淹在自己制造的噪音里了。
         用内联 data URI 而不是 public/favicon.ico：少一个文件、少一次请求，
         颜色和 --accent (#c8452f) 是同一个值，改主题时这个值要跟着改。 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8452f'/%3E%3Cg fill='%23ffffff'%3E%3Crect x='8' y='9' width='16' height='3' rx='1.5'/%3E%3Crect x='8' y='15' width='11' height='3' rx='1.5'/%3E%3Crect x='8' y='21' width='6' height='3' rx='1.5'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>知先 PriorKnow · 下一步做什么，让队列告诉你</title>
  </head>
  <body>
    <!-- React 会把整个界面挂载到这个空 div 里 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
